name: Apply staged sales policy patch
on:
  push:
    branches:
      - commercial/free-daily-sales-limit-20261121
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
permissions:
  contents: write
jobs:
  apply:
    if: ${{ github.event_name == 'pull_request' || !contains(github.event.head_commit.message, '[skip patch workflow]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - name: Apply patch and remove helper files
        env:
          BRANCH_NAME: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          set -euo pipefail
          gzip -dc .github/patches/sales-policy.patch.gz > /tmp/sales-policy.patch
          git apply --check /tmp/sales-policy.patch
          git apply /tmp/sales-policy.patch
          rm -f .github/patches/sales-policy.patch.gz .github/workflows/finish-sales-policy-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add configurable free daily sales policy [skip patch workflow]"
          git push origin "HEAD:${BRANCH_NAME}"
